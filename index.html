<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUASCAN — Sistem Pemantauan Kualitas Air | ISIF 2026</title>
<meta name="description" content="AQUASCAN: Sistem pemantauan kualitas air berbasis robot otomatis dengan peta interaktif OpenStreetMap. Prototipe ISIF 2026.">

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- App Stylesheet -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== HEADER ========== -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-group">
      <div class="brand-icon">🌊</div>
      <div class="brand-text">
        <div class="eyebrow">Sistem Pemantauan Kualitas Air</div>
        <h1>AQUASCAN</h1>
      </div>
    </div>
    <nav class="topnav">
      <a href="#" class="active" id="navBeranda">Beranda</a>
      <a href="#" id="navPeta">Peta Monitoring</a>
      <a href="#" id="navDashboard">Dashboard</a>
      <a href="#" id="navData">Dataset</a>
    </nav>
    <div class="header-right">
      <span class="timestamp-header" id="headerTimestamp"></span>
      <span class="badge-proto">Prototipe · ISIF 2026</span>
    </div>
  </div>
</header>

<!-- ========== MAIN APP LAYOUT ========== -->
<div class="app-layout">

  <!-- Sidebar Toggle (mobile) -->
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>

  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        Titik Pemantauan
        <span class="count" id="pointCount">16</span>
      </div>
      <select class="location-select" id="locationSelect">
        <option value="ciliwung">📍 Sungai Ciliwung — Depok, Jawa Barat</option>
        <option value="setu">📍 Setu Babakan — Jagakarsa, DKI Jakarta</option>
      </select>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari titik pemantauan...">
      </div>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <!-- ========== MAP + DETAIL ========== -->
  <div class="map-area">
    <div id="mainMap"></div>

    <!-- Map overlays -->
    <div class="map-info-overlay" id="mapInfoOverlay">
      <div class="info-dot"></div>
      <div class="info-text">
        <span id="infoLive">16</span> titik aktif · Pemantauan real-time
      </div>
    </div>

    <div class="map-legend" id="mapLegend">
      <h4>Indeks Pencemar (IP)</h4>
      <div class="legend-row">
        <span class="legend-dot" style="background:var(--ip-good)"></span>
        <span class="legend-label">Memenuhi Bakumutu</span>
        <span class="legend-range">0 – 1</span>
      </div>
      <div class="legend-row">
        <span class="legend-dot" style="background:var(--ip-light)"></span>
        <span class="legend-label">Cemar Ringan</span>
        <span class="legend-range">1 – 5</span>
      </div>
      <div class="legend-row">
        <span class="legend-dot" style="background:var(--ip-medium)"></span>
        <span class="legend-label">Cemar Sedang</span>
        <span class="legend-range">5 – 10</span>
      </div>
      <div class="legend-row">
        <span class="legend-dot" style="background:var(--ip-heavy)"></span>
        <span class="legend-label">Cemar Berat</span>
        <span class="legend-range">≥ 10</span>
      </div>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detailPanel">
      <div class="detail-inner">
        <div class="detail-info" id="detailInfo"></div>
        <div class="detail-minimap-section">
          <div class="detail-minimap-title" id="detailMinimapTitle">Map Lokasi Titik Sampel</div>
          <div id="detailMiniMap"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ========== APP SCRIPTS ========== -->
<!-- Load order: data → map → sidebar → detail → app -->
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/detail.js"></script>
<script src="js/app.js"></script>

</body>
</html>
